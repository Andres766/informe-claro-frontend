<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Entiende tus resultados de laboratorio en lenguaje sencillo." />
    <title>InformeClaro</title>
    <script>
      // Aplica el tema guardado antes de pintar (evita un destello del tema equivocado).
      try {
        var tema = localStorage.getItem('informeclaro_tema')
        if (tema === 'claro') document.documentElement.dataset.theme = 'light'
        else if (tema === 'oscuro') document.documentElement.dataset.theme = 'dark'
        var oscuro = tema === 'oscuro' || (tema !== 'claro' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (oscuro) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#222736')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
